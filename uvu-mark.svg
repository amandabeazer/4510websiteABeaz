  <rect width="520" height="260" fill="#ffffff" rx="24" />
  <g transform="translate(40 70)">
    <text x="0" y="60" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#275D38">UVU</text>
    <text x="0" y="120" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" fill="#6F7376">Utah Valley University</text>
    <rect x="0" y="140" width="440" height="6" fill="#275D38" rx="3" />
  </g>
</svg>
